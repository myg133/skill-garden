# AionHive Docker Compose 生产配置
# 用于生产环境高可用部署
#
# 使用方式:
#   docker-compose -f docker-compose.prod.yml up -d

services:
  # ===========================================
  # AionHive 应用 (多副本)
  # ===========================================
  app:
    deploy:
      replicas: ${REPLICAS:-3}
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    image: ${REGISTRY:-docker.io}/${IMAGE_PREFIX:-aionhive}/${IMAGE_NAME:-aion-hive}:${IMAGE_TAG:-latest}
    container_name: aionhive
    restart: always
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AION_HIVE_HTTP_PORT=8080
      - AION_HIVE_DATA_DIR=/data
      - AION_HIVE_PUBLIC_URL=${PUBLIC_URL}
      - RUST_LOG=${RUST_LOG:-warn}
      - AION_HIVE_JWT_SECRET=${JWT_SECRET}
      - AION_HIVE_JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - API_KEY_SALT=${API_KEY_SALT}
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - GITLAB_GROUP=${GITLAB_GROUP:-}
      - GITLAB_PUSH_ENABLED=${GITLAB_PUSH_ENABLED:-false}
      - GIT_PROXY_API_BASE=${GIT_PROXY_API_BASE:-}
      - AION_HIVE_EVAL_WEBHOOK_URLS=${EVAL_WEBHOOK_URLS:-}
      - AION_HIVE_CLI_ENCRYPTION_KEY=${CLI_ENCRYPTION_KEY:-}
      # 高可用配置
      - RUST_BACKTRACE=1
    volumes:
      - aionhive_data:/data
      - aionhive_skills:/skills
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aionhive-network
    depends_on:
      db:
        condition: service_healthy

  # ===========================================
  # PostgreSQL 主从复制
  # ===========================================
  db-primary:
    image: postgres:16-alpine
    container_name: aionhive-db-primary
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-aionhive}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aionhive
      - REPLICATION_USER=${DB_REPL_USER:-repl}
      - REPLICATION_PASSWORD=${DB_REPL_PASSWORD}
    volumes:
      - postgres_primary:/var/lib/postgresql/data
    command: >
      postgres
      -c max_wal_senders=10
      -c wal_level=replica
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aionhive} -d aionhive"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aionhive-network

  db-replica:
    image: postgres:16-alpine
    container_name: aionhive-db-replica
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-aionhive}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aionhive
    volumes:
      - postgres_replica:/var/lib/postgresql/data
    command: >
      postgres
      -c hot_standby=on
      -c primary_conninfo=host=db-primary port=5432 user=${DB_REPL_USER:-repl} password=${DB_REPL_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    networks:
      - aionhive-network

  # ===========================================
  # Nginx 反向代理 (可选)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: aionhive-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - aionhive-network

# ===========================================
# 持久化卷
# ===========================================
volumes:
  aionhive_data:
    driver: local
  aionhive_skills:
    driver: local
  postgres_primary:
    driver: local
  postgres_replica:
    driver: local
  nginx_certs:
    driver: local

# ===========================================
# 网络
# ===========================================
networks:
  aionhive-network:
    driver: bridge
