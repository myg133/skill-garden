{{/*
  AionHive Secret (数据库和认证配置)
  注意: 使用 --set 或 values 文件覆盖这些值
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: aionhive-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aion-hive.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "postgres://aionhive:change-me@localhost:5432/aionhive" | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default "change-me-in-production-at-least-32-chars" | quote }}
  api-key-salt: {{ .Values.secrets.apiKeySalt | default "change-me-in-production" | quote }}
{{- if .Values.secrets.gitlabToken }}
  gitlab-token: {{ .Values.secrets.gitlabToken | quote }}
{{- end }}
{{- if .Values.secrets.cliEncryptionKey }}
  cli-encryption-key: {{ .Values.secrets.cliEncryptionKey | quote }}
{{- end }}
