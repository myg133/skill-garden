name: Build CLI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    if: github.repository == 'qiang1218/skill-garden'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 musl (静态链接，无依赖)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: skill-garden
            dir: linux-x86_64
          # Linux ARM64 musl (用 cargo-zigbuild + zig 完成交叉编译，静态链接)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: skill-garden
            dir: linux-aarch64
          # macOS x86_64  暂无对应的runner
          # - os: macos-13s
          #   target: x86_64-apple-darwin
          #   artifact: skill-garden
          #   dir: macos-x86_64
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: skill-garden
            dir: macos-aarch64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: skill-garden.exe
            dir: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          # 禁用自动 CRLF 转换，避免 Windows push 的文件在 Linux runner 上有 \r
          core.autocrlf: input

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: pip install cargo-zigbuild

      - name: Install Zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build (static with zig for musl)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --no-default-features --features cli --bin skill-garden --target ${{ matrix.target }}

      - name: Build (native for non-musl)
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --no-default-features --features cli --bin skill-garden --target ${{ matrix.target }}

      - name: Prepare artifact dir
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/' | tr -d '\r')
          mkdir -p "cli-dist/${VERSION}/${{ matrix.dir }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "cli-dist/${VERSION}/${{ matrix.dir }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-garden-${{ matrix.dir }}
          path: cli-dist/
