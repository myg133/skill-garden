[package]
name = "aion-hive"
version = "0.3.0"
edition = "2021"
default-run = "server"
description = "Enterprise Skills Sharing Platform for AI Agents"
authors = ["Anspire Team"]
license = "MIT"
repository = "https://github.com/aionui/aion-hive"
rust-version = "1.70"

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:sqlx",
    "dep:tokio-postgres",
    "dep:tantivy",
    "dep:bollard",
    "dep:rmcp",
    "dep:bcrypt",
    "dep:jsonwebtoken",
    "dep:sha2",
    "dep:hex",
    "dep:hmac",
    "dep:aes-gcm",
    "dep:base64",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:dashmap",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-stream",
    "dep:fs2",
    "dep:futures-util",
    "dep:tempfile",
]
cli = [
    "dep:clap",
    "dep:dirs",
    "dep:toml",
    "dep:flate2",
    "dep:tar",
    "dep:indicatif",
]

[dependencies]
# ============================================================
# 始终需要（server + cli 共用）
# ============================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
percent-encoding = "2"

# ============================================================
# server 专用（optional）
# ============================================================
axum = { version = "0.7", features = ["multipart"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
rmcp = { version = "1.0", features = ["server", "transport-io"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
tantivy = { version = "0.22", optional = true }
bollard = { version = "0.17", optional = true }
bcrypt = { version = "0.15", optional = true }
jsonwebtoken = { version = "9", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2.2", optional = true }
dashmap = { version = "5", optional = true }
futures-util = { version = "0.3", optional = true }
tempfile = { version = "3", optional = true }
fs2 = { version = "0.4", optional = true }

# ============================================================
# cli 专用（optional）
# ============================================================
clap = { version = "4", features = ["derive"], optional = true }
dirs = { version = "5", optional = true }
toml = { version = "0.8", optional = true }
indicatif = { version = "0.17", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "skill-garden"
path = "src/bin/cli.rs"
required-features = ["cli"]
