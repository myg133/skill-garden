[package]
name = "aion-hive"
version = "0.3.0"
edition = "2021"
description = "Enterprise Skills Sharing Platform for AI Agents"
authors = ["Anspire Team"]
license = "MIT"
repository = "https://github.com/aionui/aion-hive"
rust-version = "1.70"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# MCP 协议
rmcp = { version = "1.0", features = ["server", "transport-io"] }
async-trait = "0.1"

# JSON / 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全文搜索
tantivy = "0.22"

# 文件操作
fs2 = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Semver
semver = "1"

# JWT
jsonwebtoken = "9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
tokio-postgres = "0.7"

# Password hashing
bcrypt = "0.15"

# HTTP Client (for webhook forwarding)
reqwest = { version = "0.12", features = ["json"] }

# Environment variables
dotenvy = "0.15"

# Docker container management (for Sandbox)
bollard = "0.17"

# Async mutex for container pool
dashmap = "5"

# Async stream utilities
futures-util = "0.3"

# ZIP archive handling
zip = "2.2"
# Multipart form support
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"

[[test]]
name = "integration"
path = "tests/integration.rs"
