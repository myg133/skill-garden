# ===========================================
# AionHive Helm Chart - Production 环境
# ===========================================

# 镜像配置
image:
  tag: "v0.3.0"

# 副本配置
replicaCount: 3

# 资源配额 (production 较大)
resources:
  limits:
    cpu: 2
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Ingress 配置
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: aionhive.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aionhive-prod-tls
      hosts:
        - aionhive.example.com

# 健康检查 (更严格)
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# 持久化
persistence:
  enabled: true
  storageClass: "fast-ssd"
  size: 50Gi
  skillsSize: 20Gi

# HPA 配置
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# PDB 配置
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# 配置映射 (非敏感配置, 通过 envFrom 注入)
configMap:
  enabled: true
  data:
    RUST_LOG: "warn"
    AION_HIVE_HTTP_PORT: "8080"
    AION_HIVE_DATA_DIR: "/data"

# Secret 配置 (使用 --set 覆盖)
secrets:
  databaseUrl: ""
  jwtSecret: ""
  apiKeySalt: ""
