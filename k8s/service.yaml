apiVersion: v1
kind: Service
metadata:
  name: aionhive
  namespace: aionhive
  labels:
    app.kubernetes.io/name: aionhive
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: aionhive
