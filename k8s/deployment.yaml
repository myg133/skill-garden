# ===========================================
# AionHive Deployment
# ===========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aionhive
  namespace: aionhive
  labels:
    app.kubernetes.io/name: aionhive
    app.kubernetes.io/version: "0.3.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aionhive
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aionhive
        app.kubernetes.io/version: "0.3.0"
    spec:
      serviceAccountName: aionhive
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: aionhive
          image: aionhive/aion-hive:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aionhive-secret
                  key: database-url
            - name: AION_HIVE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aionhive-secret
                  key: jwt-secret
            - name: API_KEY_SALT
              valueFrom:
                secretKeyRef:
                  name: aionhive-secret
                  key: api-key-salt
            - name: AION_HIVE_HTTP_PORT
              value: "8080"
            - name: AION_HIVE_DATA_DIR
              value: "/data"
            - name: RUST_LOG
              value: "warn"
            - name: RUST_BACKTRACE
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: skills
              mountPath: /skills
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aionhive-data
        - name: skills
          persistentVolumeClaim:
            claimName: aionhive-skills
