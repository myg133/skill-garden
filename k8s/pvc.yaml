# ===========================================
# AionHive PersistentVolumeClaim
# ===========================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aionhive-data
  namespace: aionhive
  labels:
    app.kubernetes.io/name: aionhive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: fast-ssd  # 如需特定存储类，取消注释

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aionhive-skills
  namespace: aionhive
  labels:
    app.kubernetes.io/name: aionhive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
